name: ci
on:
  push:
  pull_request:
jobs:
  test:
    # Pinned: ubuntu-latest (26.04) has no Python 3.9 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -q -m "not live"
      # Not --strict: strict mode fails on the missing `version` (deliberately absent).
      # Skipped when the claude CLI is not installed on the runner.
      - run: |
          if command -v claude >/dev/null; then
            claude plugin validate ./plugin
          else
            echo "claude CLI not installed; skipping plugin validation"
          fi
